; PHP settings for the API on Vercel. The vercel-php runtime reads this exact
; path (api/php.ini) and merges it into its own php.ini at build time.
expose_php = Off
display_errors = Off
log_errors = On
; Stack traces in the error log list functions, never their arguments, which
; can be a patient's details.
zend.exception_ignore_args = On
memory_limit = 128M
max_execution_time = 30
post_max_size = 1M
file_uploads = Off
allow_url_fopen = Off
date.timezone = UTC
session.auto_start = 0
