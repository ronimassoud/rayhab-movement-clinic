; PHP settings for the Rayhab API, for both PHP-FPM and the CLI (cron worker).
; Installed by provision.sh into /etc/php/<version>/{fpm,cli}/conf.d/.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 128M
max_execution_time = 30
post_max_size = 1M
file_uploads = Off
allow_url_fopen = Off
date.timezone = UTC
session.auto_start = 0

; Code changes only on a deploy, which reloads PHP-FPM.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.enable_cli = 0

; mail() hands messages to msmtp (/etc/msmtprc), which sends them through
; the clinic's SMTP provider.
sendmail_path = "/usr/bin/msmtp -t"
