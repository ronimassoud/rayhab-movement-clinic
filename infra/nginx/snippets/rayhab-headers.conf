# Security headers for every response. Nginx drops add_header from outer
# levels when a location sets its own, so each location includes this.
#
# Content-Security-Policy: scripts only from this site, plus the two inline
# scripts by hash (the motion gate on every page, the 404 page's base path).
# If either inline script changes, recompute its hash (README.md, "Production
# hosting"). connect-src 'self' covers /api; nothing calls another origin.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; script-src 'self' 'sha256-yb+kXgh5zw4DMCqxJK0NpZLXmcTGnfjGoW1XuTC6uLo=' 'sha256-48v3BVFceGGoCmEY8yhA3vVDPhB5xCDfXJYamli5VYQ='; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
