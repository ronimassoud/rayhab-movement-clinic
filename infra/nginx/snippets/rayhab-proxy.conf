# Pass /api/ through to the API unchanged (it keeps its /api prefix).
# $rh_api_port is set per site: 3000 production, 3001 staging.
proxy_pass http://127.0.0.1:$rh_api_port;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;
proxy_buffering on;
# The API sets Cache-Control: no-store itself; make sure no cache in between keeps anything.
proxy_no_cache 1;
proxy_cache_bypass 1;
