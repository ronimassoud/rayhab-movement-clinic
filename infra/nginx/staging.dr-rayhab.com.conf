# staging.dr-rayhab.com: the full stack before production, with its own
# Supabase project, the Whish sandbox and test WhatsApp numbers. Behind a
# password (basic auth) and never indexed. Webhooks are left open so Meta
# and Whish can reach it; they authenticate themselves.

server {
    listen 80;
    listen [::]:80;
    server_name staging.dr-rayhab.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://staging.dr-rayhab.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.dr-rayhab.com;
    ssl_certificate     /etc/letsencrypt/live/staging.dr-rayhab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.dr-rayhab.com/privkey.pem;
    include /etc/nginx/snippets/rayhab-tls.conf;

    root /srv/rayhab/staging/site/current;
    set $rh_api_port 3001;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;

    auth_basic "Rayhab staging";
    auth_basic_user_file /etc/nginx/rayhab-staging.htpasswd;

    include /etc/nginx/snippets/rayhab-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    error_page 404 /404.html;

    location /api/webhooks/ {
        auth_basic off;
        include /etc/nginx/snippets/rayhab-proxy.conf;
    }
    location /api/ {
        limit_req zone=rh_api burst=40 nodelay;
        include /etc/nginx/snippets/rayhab-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/rayhab-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
