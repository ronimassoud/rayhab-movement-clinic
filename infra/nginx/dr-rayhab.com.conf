# dr-rayhab.com: the static site, and /api/ proxied to the API on 127.0.0.1:3000.
# Installed by infra/scripts/provision.sh as /etc/nginx/sites-available/dr-rayhab.com.
# TLS certificates come from Let's Encrypt (certbot), renewed automatically.

limit_req_zone $binary_remote_addr zone=rh_api:10m    rate=10r/s;
limit_req_zone $binary_remote_addr zone=rh_write:10m  rate=6r/m;
limit_req_zone $binary_remote_addr zone=rh_login:10m  rate=10r/m;

# Requests logged without their query string, for pages that can carry a token.
log_format rh_noquery '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
log_format rh_masked  '$remote_addr - [$time_local] "$request_method /api/payment-selection/(token)" $status $body_bytes_sent';

map $sent_http_content_type $rh_cache {
    default                    "no-cache";
    ~*text/css                 "public, max-age=31536000, immutable";
    ~*javascript               "public, max-age=31536000, immutable";
    ~*font/                    "public, max-age=31536000, immutable";
    ~*image/                   "public, max-age=604800";
}

# HTTP -> HTTPS, one hop. The ACME path stays on HTTP for certificate renewal.
server {
    listen 80;
    listen [::]:80;
    server_name dr-rayhab.com www.dr-rayhab.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://dr-rayhab.com$request_uri; }
}

# www -> apex, one hop.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dr-rayhab.com;
    ssl_certificate     /etc/letsencrypt/live/dr-rayhab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dr-rayhab.com/privkey.pem;
    include /etc/nginx/snippets/rayhab-tls.conf;
    return 301 https://dr-rayhab.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dr-rayhab.com;
    ssl_certificate     /etc/letsencrypt/live/dr-rayhab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dr-rayhab.com/privkey.pem;
    include /etc/nginx/snippets/rayhab-tls.conf;

    # The site as built by CI; deploy.sh switches this link to each new release.
    root /srv/rayhab/production/site/current;
    set $rh_api_port 3000;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;
    server_tokens off;

    include /etc/nginx/snippets/rayhab-headers.conf;
    # Turn this on only once HTTPS is confirmed working everywhere (runbook step 10).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/rayhab-headers.conf; }

    # The old service URL, now a single 301.
    location = /services/frc-joint-training.html { return 301 /services/joint-training-mobility.html; }

    # The API. Never cached; rate-limited, more strictly for writes and sign-in.
    location /api/ {
        limit_req zone=rh_api burst=40 nodelay;
        include /etc/nginx/snippets/rayhab-proxy.conf;
    }
    location ~ ^/api/(appointments|enquiries)$ {
        limit_req zone=rh_write burst=5 nodelay;
        include /etc/nginx/snippets/rayhab-proxy.conf;
    }
    # The patient's link token is in this path: log the route, not the token.
    location ^~ /api/payment-selection/ {
        limit_req zone=rh_api burst=20 nodelay;
        access_log /var/log/nginx/access.log rh_masked;
        include /etc/nginx/snippets/rayhab-proxy.conf;
    }
    location ~ ^/api/admin/(login|mfa/) {
        limit_req zone=rh_login burst=5 nodelay;
        include /etc/nginx/snippets/rayhab-proxy.conf;
    }

    # Private pages: never indexed, never stored.
    location ^~ /admin/ {
        include /etc/nginx/snippets/rayhab-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
    location ^~ /payment/ {
        include /etc/nginx/snippets/rayhab-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        access_log /var/log/nginx/access.log rh_noquery;
        try_files $uri $uri/ =404;
    }

    location / {
        add_header Cache-Control $rh_cache always;
        include /etc/nginx/snippets/rayhab-headers.conf;
        try_files $uri $uri/ =404;
    }
}
