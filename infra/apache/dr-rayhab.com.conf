# dr-rayhab.com. Installed as /etc/apache2/sites-available/dr-rayhab.com.conf.
# Port 80 answers only the certificate challenge and redirects to HTTPS;
# www redirects to the apex. Certificates: Let's Encrypt (certbot), renewed
# automatically, Apache reloaded after each renewal.

<VirtualHost *:80>
    Use RayhabHttp dr-rayhab.com dr-rayhab.com
    ServerAlias www.dr-rayhab.com
</VirtualHost>

<VirtualHost *:443>
    ServerName www.dr-rayhab.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/dr-rayhab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dr-rayhab.com/privkey.pem
    Redirect 301 / https://dr-rayhab.com/
</VirtualHost>

<VirtualHost *:443>
    Use RayhabSite production dr-rayhab.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/dr-rayhab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dr-rayhab.com/privkey.pem
</VirtualHost>
