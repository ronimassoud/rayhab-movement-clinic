# Rayhab: what both sites share, as a macro (mod_macro), so production and
# staging are the same configuration with different folders.
# Installed by infra/scripts/provision.sh as /etc/apache2/conf-available/rayhab.conf.
#
#   Use RayhabSite <env> <host>
#
# serves /srv/rayhab/<env>/site/current as the website and sends /api/* to
# the PHP API in /srv/rayhab/<env>/api/current, through PHP-FPM.

# Access logs never hold a payment-link token: the API path that carries one
# is logged without it, and the payment page without its query string.
LogFormat "%h %l %u %t \"%m /api/payment-selection/(token) %H\" %>s %b" rayhab_token
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" rayhab_noquery

<Macro RayhabSite $env $host>
    ServerName $host
    DocumentRoot /srv/rayhab/$env/site/current
    Protocols h2 http/1.1
    ServerSignature Off

    <Directory /srv/rayhab/$env/site>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorDocument 404 /404.html

    # The old service URL, one 301.
    Redirect 301 /services/frc-joint-training.html /services/joint-training-mobility.html

    # ---- The API: every /api/* request goes to public/index.php ----
    RewriteEngine On
    RewriteRule ^/api/ /srv/rayhab/$env/api/current/public/index.php [L]
    <Directory /srv/rayhab/$env/api>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>
    # Granted by the link and by the release it points to, however Apache
    # resolves the symlink.
    <DirectoryMatch "^/srv/rayhab/$env/api/(current|releases/[^/]+)/public">
        Require all granted
        <Files "index.php">
            SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
        </Files>
    </DirectoryMatch>
    # Where the API finds its settings (mode 640, group www-data).
    SetEnv RAYHAB_ENV_FILE /srv/rayhab/$env/app.env

    # ---- Headers on every response ----
    # Scripts only from this site, plus the two inline scripts by hash (the
    # motion gate on every page, the 404 page's base path). If either inline
    # script changes, recompute its hash (README.md, "Production hosting").
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; script-src 'self' 'sha256-yb+kXgh5zw4DMCqxJK0NpZLXmcTGnfjGoW1XuTC6uLo=' 'sha256-48v3BVFceGGoCmEY8yhA3vVDPhB5xCDfXJYamli5VYQ='; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    # HTTPS only, remembered by browsers. One day to start, so a certificate
    # problem in the first week cannot lock visitors out for long; raised to a
    # year once production checks out (runbook step 10.6). Sent on HTTPS
    # responses only, as browsers require.
    Header always set Strict-Transport-Security "max-age=86400"

    # ---- Caching ----
    # CSS and JS URLs carry a content hash (?v=), and fonts change only with
    # their file name: kept a year. Images: a week. Pages: always revalidated.
    <LocationMatch "^/assets/(css|js|fonts)/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/assets/img/">
        Header always set Cache-Control "public, max-age=604800"
    </LocationMatch>
    <FilesMatch "\.html$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>

    # ---- Private pages: never indexed, never stored ----
    <LocationMatch "^/(admin|payment)/">
        Header always set X-Robots-Tag "noindex, nofollow"
        Header always set Cache-Control "no-store"
    </LocationMatch>
    <LocationMatch "^/payment/">
        Header always set Referrer-Policy "no-referrer"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml text/xml

    # ---- Logs ----
    # In their own folder, which provision.sh rotates daily and keeps 14 days
    # (IP addresses are personal data; the privacy notice states the period).
    SetEnvIf Request_URI "^/api/payment-selection/" rh_token rh_private
    SetEnvIf Request_URI "^/payment/" rh_page rh_private
    ErrorLog ${APACHE_LOG_DIR}/rayhab/$env-error.log
    CustomLog ${APACHE_LOG_DIR}/rayhab/$env-access.log combined env=!rh_private
    CustomLog ${APACHE_LOG_DIR}/rayhab/$env-access.log rayhab_token env=rh_token
    CustomLog ${APACHE_LOG_DIR}/rayhab/$env-access.log rayhab_noquery env=rh_page
</Macro>

# Port 80 for a host: only the certificate challenge, and one 301 to HTTPS.
<Macro RayhabHttp $host $target>
    ServerName $host
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://$target%{REQUEST_URI} [R=301,L]
</Macro>

# Shared TLS settings (Mozilla "intermediate").
SSLProtocol             -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder     off
SSLSessionTickets       off
SSLUseStapling          on
SSLStaplingCache        "shmcb:logs/ssl_stapling(32768)"
