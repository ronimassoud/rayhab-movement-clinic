# staging.dr-rayhab.com: the full stack before production, with its own
# Supabase project, the Whish sandbox and test WhatsApp numbers. Behind a
# password and never indexed. The health check and the webhooks stay open:
# the deploy checks one, and Meta and Whish authenticate themselves.

<VirtualHost *:80>
    Use RayhabHttp staging.dr-rayhab.com staging.dr-rayhab.com
</VirtualHost>

<VirtualHost *:443>
    Use RayhabSite staging staging.dr-rayhab.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/staging.dr-rayhab.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.dr-rayhab.com/privkey.pem

    Header always set X-Robots-Tag "noindex, nofollow"
    <Location "/">
        AuthType Basic
        AuthName "Rayhab staging"
        AuthUserFile /etc/apache2/rayhab-staging.htpasswd
        Require valid-user
    </Location>
    <LocationMatch "^/api/(health|webhooks/)">
        Require all granted
    </LocationMatch>
</VirtualHost>
