# The API and the worker on the VPS. One copy per environment:
#
#   docker compose -p rayhab-production --env-file /srv/rayhab/production/compose.env -f compose.yaml up -d
#   docker compose -p rayhab-staging    --env-file /srv/rayhab/staging/compose.env    -f compose.yaml up -d
#
# compose.env holds only IMAGE, API_PORT and APP_ENV_FILE (written by deploy.sh).
# The application's own settings and secrets live in APP_ENV_FILE
# (/srv/rayhab/<env>/app.env, mode 600, see infra/env.example).
#
# There is no database here: PostgreSQL is Supabase. Nothing listens on a
# public interface: the API binds 127.0.0.1 on the host network and Nginx
# is the only way in.
name: rayhab

x-common: &common
  image: ${IMAGE:?set IMAGE}
  env_file: ${APP_ENV_FILE:?set APP_ENV_FILE}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  api:
    <<: *common
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: ${API_PORT:-3000}
      TRUST_PROXY: 127.0.0.1
    command: ["node", "dist/server.js"]

  worker:
    <<: *common
    command: ["node", "dist/worker.js"]
    healthcheck:
      # The worker touches /tmp/heartbeat on every tick.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/heartbeat');process.exit(Date.now()-s.mtimeMs<60000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
