name: Nightly database backup

# While Supabase is on the Free plan (no backups of its own): a nightly dump of
# the rayhab schema in production, encrypted to the clinic's age public key,
# kept as a workflow artifact for 14 days (the backup period in the privacy
# notice). Without a key it refuses: this repository is public, so only
# encrypted copies may ever be stored here, and only the private key, kept
# off GitHub, opens them.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL  the production DATABASE_MIGRATE_URL (postgres login)
#   BACKUP_RECIPIENT     the age public key (age1...)
# Restore: download the artifact, then
#   age -d -i rayhab-backup-key.txt rayhab-production-*.sql.gz.age | gunzip | psql "<target postgres URL>"

on:
  schedule:
    - cron: '15 1 * * *'      # 01:15 UTC, 04:15 in Beirut
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Settings present
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RECIPIENT: ${{ secrets.BACKUP_RECIPIENT }}
        run: |
          [ -n "$URL" ] || { echo "::error::Add the BACKUP_DATABASE_URL secret (runbook, Backups)."; exit 1; }
          case "$RECIPIENT" in age1*) ;; *) echo "::error::Add the BACKUP_RECIPIENT secret, an age public key (age1...). Unencrypted backups are never stored."; exit 1 ;; esac

      - name: Dump and encrypt
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RECIPIENT: ${{ secrets.BACKUP_RECIPIENT }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age >/dev/null
          # The URL reaches pg_dump as libpq's PG* variables, never on a command line.
          eval "$(python3 - <<'PY'
          import os, shlex
          from urllib.parse import urlparse, unquote, parse_qs
          u = urlparse(os.environ["URL"]); q = parse_qs(u.query)
          for k, v in (("PGHOST", u.hostname), ("PGPORT", str(u.port or 5432)), ("PGUSER", unquote(u.username or "")),
                       ("PGPASSWORD", unquote(u.password or "")), ("PGDATABASE", (u.path or "/postgres")[1:] or "postgres"),
                       ("PGSSLMODE", q.get("sslmode", ["require"])[0])):
              print("export %s=%s" % (k, shlex.quote(v)))
          PY
          )"
          echo "::add-mask::$PGPASSWORD"
          mkdir -p out
          OUT="out/rayhab-production-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.age"
          # pg_dump from the PostgreSQL 17 image, new enough for Supabase's server.
          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17 \
            pg_dump --schema=rayhab --no-owner --no-privileges | gzip -9 | age -r "$RECIPIENT" > "$OUT"
          test -s "$OUT"
          echo "backup $(basename "$OUT") ($(du -h "$OUT" | cut -f1), encrypted)"

      - uses: actions/upload-artifact@v7
        with:
          name: rayhab-production-backup-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: error
