name: Deploy to GitHub Pages

# The site lives in site/ rather than the repo root or docs/, so it is
# published as an artifact from Actions instead of straight off a branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The compiled stylesheet is committed, so the site can be previewed with
      # nothing installed. It is rebuilt here anyway, so what is published
      # always matches src/css.
      - name: Build the stylesheet
        run: npm ci && npm run build

      # Versions every stylesheet and script URL by its content (?v=<hash>),
      # so a browser can never pair a new page with a cached old file.
      - name: Version asset URLs
        run: python3 content/stamp.py

      # Lists every indexable page by its own canonical, so a new or removed
      # page is reflected without anyone editing the sitemap.
      - name: Write the sitemap
        run: python3 content/sitemap.py

      - name: Check every internal link resolves
        run: python3 .github/scripts/check_links.py site

      # This workflow publishes the GitHub Pages *staging* copy. Production
      # (https://dr-rayhab.com) is deployed separately and must not run this
      # step: it marks every page noindex so the mirror never competes with
      # production in search results.
      - name: Keep the staging copy out of search engines
        run: python3 content/staging_noindex.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
