name: API CI

# The PHP booking API and its Vercel configuration, checked on every push to
# any branch. Nothing here deploys: Vercel deploys from Git.

on:
  push:
    paths: ['api/**', 'infra/**', 'vercel.json', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['api/**', 'infra/**', 'vercel.json', '.github/workflows/api-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The PostgreSQL major version Supabase runs, with btree_gist.
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: rayhab }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, curl, mbstring, openssl
          tools: none
      - name: Lint every PHP file
        run: find api -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Tests on PostgreSQL 16
        run: php api/tests/run.php
        env: { TEST_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/rayhab?sslmode=disable' }

  vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: vercel.json (function, route, cron, headers, script hashes)
        run: node infra/vercel/check-config.mjs
      - name: Build guard (production refuses drafts; previews get noindex)
        run: |
          for d in prod prev; do mkdir -p /tmp/$d/infra/vercel && cp -r site /tmp/$d/site && cp infra/vercel/build.mjs /tmp/$d/infra/vercel/; done
          if grep -rlq 'data-draft' site; then
            if (cd /tmp/prod && VERCEL_ENV=production node infra/vercel/build.mjs); then echo "::error::the production build accepted draft pages"; exit 1; fi
          else
            (cd /tmp/prod && VERCEL_ENV=production node infra/vercel/build.mjs)
          fi
          (cd /tmp/prev && VERCEL_ENV=preview node infra/vercel/build.mjs)
          grep -q 'content="noindex"' /tmp/prev/site/index.html
