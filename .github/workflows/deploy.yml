name: Deploy to the server

# Releases the site and the PHP booking API to the VPS
# (docs/production-runbook.md). Run by hand from the Actions tab: choose
# staging or production. Each is a GitHub environment; "production" should
# require an approval (runbook step 9), so nothing reaches dr-rayhab.com
# without someone saying so.
#
# GitHub Pages (pages.yml) is separate and unchanged: it stays the demo preview.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://dr-rayhab.com' || 'https://staging.dr-rayhab.com' }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: rayhab }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }

      # The same build and checks as the Pages workflow, without its staging
      # step: production pages must carry no noindex and no demo flag.
      - name: Build and check the site
        run: |
          npm ci && npm run build
          npm test
          python3 content/stamp.py
          python3 content/sitemap.py
          python3 .github/scripts/check_links.py site
          if grep -rl 'name="rayhab-demo"' site --include=*.html; then echo "demo flag found in production pages" >&2; exit 1; fi
          # A page still awaiting legal review (privacy.html while it is a
          # draft) may go to staging for review, never to production.
          if [ "${{ inputs.environment }}" = production ] && grep -rl 'data-draft' site --include=*.html; then
            echo "These pages are drafts awaiting legal review; remove data-draft once approved." >&2; exit 1
          fi

      - name: Staging only - keep it out of search engines
        if: inputs.environment == 'staging'
        run: python3 content/staging_noindex.py site

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_pgsql, curl, mbstring, openssl', tools: none }

      - name: Test the API
        run: php api/tests/run.php
        env: { TEST_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/rayhab?sslmode=disable' }

      - name: Package the release
        run: |
          tar -czf "site-${GITHUB_SHA::12}.tgz" -C site .
          tar -czf "api-${GITHUB_SHA::12}.tgz" -C api --exclude=dev --exclude=tests .

      - name: Upload and release
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          S="site-${GITHUB_SHA::12}.tgz"; A="api-${GITHUB_SHA::12}.tgz"
          scp -i ~/.ssh/id_deploy "$S" "$A" "deploy@$SSH_HOST:/tmp/"
          ssh -i ~/.ssh/id_deploy "deploy@$SSH_HOST" \
            "/srv/rayhab/bin/deploy.sh '${{ inputs.environment }}' '/tmp/$S' '/tmp/$A'"

      - name: Smoke test
        run: |
          BASE="${{ inputs.environment == 'production' && 'https://dr-rayhab.com' || 'https://staging.dr-rayhab.com' }}"
          AUTH=""
          if [ "${{ inputs.environment }}" = staging ]; then AUTH="-u rayhab:${{ secrets.STAGING_BASIC_AUTH }}"; fi
          curl -fsS "$BASE/api/health"
          curl -fsS $AUTH -o /dev/null "$BASE/"
          test "$(curl -s $AUTH -o /dev/null -w '%{http_code}' "$BASE/no-such-page")" = 404
          curl -fsS $AUTH "$BASE/api/services" | grep -q '"services"'
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://${BASE#https://}/")" = 301

      # The security headers, checked on what the server actually sends
      # (the audit's verification plan), and old TLS refused.
      - name: Security headers and TLS
        run: |
          BASE="${{ inputs.environment == 'production' && 'https://dr-rayhab.com' || 'https://staging.dr-rayhab.com' }}"
          AUTH=""
          if [ "${{ inputs.environment }}" = staging ]; then AUTH="-u rayhab:${{ secrets.STAGING_BASIC_AUTH }}"; fi
          has() {   # has <path> <header line, start, case-insensitive>
            curl -sS $AUTH -o /dev/null -D - "$BASE$1" | tr -d '\r' | grep -qi "^$2" || { echo "$1 is missing: $2" >&2; exit 1; }
          }
          has / 'strict-transport-security: max-age='
          has / 'content-security-policy: default-src '"'"'self'"'"
          has / 'x-content-type-options: nosniff'
          has / 'x-frame-options: deny'
          has / 'referrer-policy: strict-origin-when-cross-origin'
          has / 'permissions-policy: camera=()'
          has /admin/ 'cache-control: no-store'
          has /admin/ 'x-robots-tag: noindex'
          has /payment/ 'cache-control: no-store'
          has /payment/ 'referrer-policy: no-referrer'
          has /payment/ 'x-robots-tag: noindex'
          # Staff data needs a session, whatever the page does.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/admin/appointments")" = 401
          # TLS 1.0 and 1.1 must be refused.
          if curl -s -o /dev/null --tlsv1.0 --tls-max 1.1 "$BASE/" 2>/dev/null; then echo "the server accepts TLS older than 1.2" >&2; exit 1; fi
          echo "security headers and TLS ok"
