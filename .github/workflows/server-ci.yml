name: Server CI

# The booking API and the infra files, checked on every push to any branch.
# Nothing here deploys; that is deploy.yml, run by hand.

on:
  push:
    paths: ['server/**', 'infra/**', 'site/assets/js/api/time.js', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['server/**', 'infra/**', 'site/assets/js/api/time.js', '.github/workflows/server-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The same PostgreSQL major version Supabase runs, with btree_gist.
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: rayhab }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests on PGlite
        run: npm test
      - name: Tests on PostgreSQL 16
        run: npm test
        env: { TEST_DATABASE_URL: 'postgres://postgres:ci@localhost:5432/rayhab' }
      - name: Build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t rayhab-server:ci server
      - name: The image refuses to start without configuration
        run: |
          if docker run --rm rayhab-server:ci; then echo "started without APP_SECRET" >&2; exit 1; fi

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (shellcheck)
        run: shellcheck infra/scripts/*.sh
      - name: Compose file
        run: |
          printf 'APP_SECRET=x\n' > /tmp/app.env
          IMAGE=rayhab-server:ci APP_ENV_FILE=/tmp/app.env API_PORT=3000 docker compose -f infra/compose.yaml config -q
      - name: Nginx configuration (nginx -t with throwaway certificates)
        run: |
          mkdir -p /tmp/le/live/dr-rayhab.com /tmp/le/live/staging.dr-rayhab.com
          for d in dr-rayhab.com staging.dr-rayhab.com; do
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$d" \
              -keyout /tmp/le/live/$d/privkey.pem -out /tmp/le/live/$d/fullchain.pem 2>/dev/null
          done
          touch /tmp/htpasswd
          docker run --rm \
            -v "$PWD/infra/nginx/dr-rayhab.com.conf:/etc/nginx/conf.d/a.conf:ro" \
            -v "$PWD/infra/nginx/staging.dr-rayhab.com.conf:/etc/nginx/conf.d/b.conf:ro" \
            -v "$PWD/infra/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/le:/etc/letsencrypt:ro -v /tmp/htpasswd:/etc/nginx/rayhab-staging.htpasswd:ro \
            nginx:1.27 nginx -t
      - name: deploy.sh dry run
        run: |
          sudo mkdir -p /srv/rayhab/staging /srv/rayhab/bin && sudo chown -R "$USER" /srv/rayhab
          cp infra/compose.yaml /srv/rayhab/bin/
          install -m 600 /dev/null /srv/rayhab/staging/app.env
          install -m 600 /dev/null /srv/rayhab/staging/migrate.env
          tar -czf /tmp/site.tgz -C site .
          DRY_RUN=1 bash infra/scripts/deploy.sh staging rayhab-server:ci /tmp/site.tgz
